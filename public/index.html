<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/app.css" />
    <title>TextMaker</title>
  </head>
  <body>
    <main>
      <h1>
        Create Text Line
        <span id="msg" role="alert"></span>
      </h1>
      <p>
        Create batch SQL queries or text from placeholders. Put values in the
        columns below and each <code>{}</code> is filled in column order.
      </p>

      <form id="form1" name="form1">
        <div>
          <label for="query">
            Query: <code>{}</code> = placeholder, for example:
            <code>DELETE FROM table1 WHERE name = '{}';</code>
          </label>
          <textarea
            id="query"
            rows="4"
            spellcheck="false"
            placeholder="DELETE FROM table1 WHERE name = '{}';"
          ></textarea>
        </div>

        <fieldset>
          <legend>Values</legend>
          <div class="columns" id="columns">
            <textarea id="c1" rows="12" spellcheck="false"></textarea>
            <textarea id="c2" rows="12" spellcheck="false"></textarea>
            <textarea id="c3" rows="12" spellcheck="false"></textarea>
            <textarea id="c4" rows="12" spellcheck="false"></textarea>
            <textarea id="c5" rows="12" spellcheck="false"></textarea>
          </div>
        </fieldset>

        <button type="button" class="btn" id="btn_create">Create Lines</button>
      </form>

      <section>
        <label for="result">Result</label>
        <textarea id="result" rows="12" readonly spellcheck="false"></textarea>
      </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
